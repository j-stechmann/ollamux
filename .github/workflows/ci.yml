name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  packaging-lint:
    name: packaging-lint
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm git
          # makepkg ships with pacman (already in the base-devel image)
      - uses: actions/checkout@v5
      - name: PKGBUILD validity + .SRCINFO freshness
        run: |
          # container jobs run as root; makepkg refuses EUID 0 and needs
          # write access to the package dir it runs in
          useradd -m builder
          for p in packaging/aur/ollamux packaging/aur/ollamux-bin; do
            cd "$GITHUB_WORKSPACE/$p"
            chown -R builder:builder .
            runuser -u builder -- makepkg --printsrcinfo > /tmp/expected.SRCINFO
            diff -u .SRCINFO /tmp/expected.SRCINFO \
              || { echo "::error::$p/.SRCINFO is stale (run makepkg --printsrcinfo)"; exit 1; }
            cd - >/dev/null
          done

  automerge:
    name: automerge dependabot PR
    needs: [check, packaging-lint]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: arm auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}