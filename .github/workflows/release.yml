name: Release

on:
  push:
    tags: ['v*']
  # Manual re-run: `gh workflow run release.yml --ref v0.1.0` re-publishes
  # an existing tag (e.g. after adding AUR/COPR/crates.io secrets later;
  # secret-gated jobs skip when their secrets are absent).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- 1. static binaries (musl, native runners) --------------------
  binaries:
    name: binary ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build (static)
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --locked --release --target ${{ matrix.target }}
      - name: smoke
        run: ./target/${{ matrix.target }}/release/ollamux --version
      - name: package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir "ollamux-$VER-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/ollamux" "ollamux-$VER-${{ matrix.arch }}/"
          cp README.md LICENSE "ollamux-$VER-${{ matrix.arch }}/"
          tar -czf "ollamux-$VER-${{ matrix.arch }}.tar.gz" "ollamux-$VER-${{ matrix.arch }}"
          sha256sum "ollamux-$VER-${{ matrix.arch }}.tar.gz" > "ollamux-$VER-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: |
            ollamux-*-*.tar.gz
            ollamux-*-*.tar.gz.sha256
          if-no-files-found: error

  # ---- 2. source + vendor tarballs ----------------------------------
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/vendor-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            dist/ollamux-*.tar.gz
            dist/ollamux-*-vendor.tar.xz
            dist/ollamux-*-cargo-config.toml
            dist/SHA256SUMS
          if-no-files-found: error

  # ---- 3. deb (debian:trixie, offline vendored build) ---------------
  deb:
    needs: [source]
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: read
    steps:
      - name: install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cargo rustc pkg-config dpkg-dev
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: unpack + rustc sanity
        run: |
          rustc --version
          tar -xzf ollamux-*.tar.gz
          VER="${GITHUB_REF_NAME#v}"
          # vendor/ lands inside the source tree; the in-tree
          # .cargo/config.toml (in the tarball) makes this offline.
          tar -xJf "ollamux-$VER-vendor.tar.xz" -C "ollamux-$VER"
      - name: offline build
        run: |
          cd "ollamux-${GITHUB_REF_NAME#v}"
          cargo build --locked --offline --release
      - name: assemble deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          D="ollamux-$VER-deb/DEBIAN"
          mkdir -p "$D" "ollamux-$VER-deb/usr/bin" "ollamux-$VER-deb/usr/share/man/man1" \
                   "ollamux-$VER-deb/usr/share/licenses/ollamux" \
                   "ollamux-$VER-deb/usr/lib/systemd/system"
          install -m755 "ollamux-$VER/target/release/ollamux" "ollamux-$VER-deb/usr/bin/"
          # unit/man live inside the source tarball (job has no checkout)
          gzip -9c "ollamux-$VER/packaging/ollamux.1" > "ollamux-$VER-deb/usr/share/man/man1/ollamux.1.gz"
          install -m644 "ollamux-$VER/packaging/ollamux.service" "ollamux-$VER-deb/usr/lib/systemd/system/"
          install -m644 "ollamux-$VER/LICENSE" "ollamux-$VER-deb/usr/share/licenses/ollamux/"
          # control file (minimum viable; lintian-cleanliness is distro's job)
          {
            echo "Package: ollamux"
            echo "Version: $VER-1"
            echo "Architecture: amd64"
            echo "Maintainer: Jonathan Stechmann <69059260+j-stechmann@users.noreply.github.com>"
            echo "Depends: libc6 (>= 2.34)"
            echo "Description: key-rotating reverse proxy for the Ollama Cloud API"
          } > "$D/control"
          dpkg-deb --build --root-owner-group "ollamux-$VER-deb" "ollamux_${VER}-1_amd64.deb"
          sha256sum "ollamux_${VER}-1_amd64.deb" > "ollamux_${VER}-1_amd64.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            *.deb
            *.deb.sha256
          if-no-files-found: error

  # ---- 4. rpm (fedora, rpmbuild + vendor tarball) -------------------
  rpm:
    needs: [source]
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    steps:
      - name: install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build cargo rust-packaging systemd-rpm-macros tar xz gzip git
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: assemble rpmbuild tree
        run: |
          VER="${GITHUB_REF_NAME#v}"
          rpmbuild_dir="$HOME/rpmbuild"
          mkdir -p "$rpmbuild_dir"/{SOURCES,SPECS,RPMS,SRPMS,BUILD}
          cp "ollamux-$VER.tar.gz" \
             "ollamux-$VER-vendor.tar.xz" "$rpmbuild_dir/SOURCES/"
          # spec/unit/man come from inside the source tarball (this job
          # has no checkout); the tarball is the artifact under test.
          tar -xzf "ollamux-$VER.tar.gz" \
            "ollamux-$VER/packaging/rpm/ollamux.spec" \
            "ollamux-$VER/packaging/ollamux.service" \
            "ollamux-$VER/packaging/ollamux.1"
          cp "ollamux-$VER/packaging/ollamux.service" "$rpmbuild_dir/SOURCES/ollamux.service"
          cp "ollamux-$VER/packaging/ollamux.1" "$rpmbuild_dir/SOURCES/ollamux.1"
          cp "ollamux-$VER/packaging/rpm/ollamux.spec" "$rpmbuild_dir/SPECS/ollamux.spec"
      - name: build rpm + srpm
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/ollamux.spec
          sha256sum ~/rpmbuild/RPMS/x86_64/*.rpm > rpm.sha256
          sha256sum ~/rpmbuild/SRPMS/*.src.rpm > srpm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: |
            /github/home/rpmbuild/RPMS/x86_64/*.rpm
            /github/home/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

  # ---- 5. GitHub Release: gather artifacts + publish -----------------
  release:
    needs: [binaries, source, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # the rpm artifact preserves container-internal paths
      # (/github/home/rpmbuild/...); hoist the packages up
      - name: flatten rpm paths
        run: |
          if [ -d github/home/rpmbuild ]; then
            mv -v github/home/rpmbuild/RPMS/x86_64/*.rpm .
            mv -v github/home/rpmbuild/SRPMS/*.src.rpm .
            rm -rf github
          fi
          ls -la
      - name: create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ollamux-*-*.tar.gz
            ollamux-*-*.tar.gz.sha256
            ollamux_*.deb
            ollamux_*.deb.sha256
            *.rpm
            *.src.rpm
            ollamux-*-vendor.tar.xz
            SHA256SUMS

  # ---- 6. container image to GHCR ------------------------------------
  container:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # ---- 7. AUR push (ollamux source + ollamux-bin), real makepkg ------------
  # Skips cleanly when AUR_SSH_KEY is not configured (e.g. AUR signups
  # closed); add the secret later and re-run this job via workflow_dispatch.
  aur:
    needs: [release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ollamux
          - pkg: ollamux-bin
    permissions:
      contents: read
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - name: check for AUR secret
        id: secret
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_KEY not set — skipping AUR publish (add the secret + re-run this job to publish)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: install tooling
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: pacman -Syu --noconfirm git openssh pacman-contrib
      - uses: actions/checkout@v5
        if: ${{ steps.secret.outputs.available == 'true' }}
      - name: prepare non-root makepkg user
        if: ${{ steps.secret.outputs.available == 'true' }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          # container jobs run as root; makepkg refuses EUID 0 and needs
          # write access to the package dir it runs in
          useradd -m builder
          chown -R builder:builder "packaging/aur/$PKG"
      - name: configure ssh
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          # makepkg comes with pacman; updpkgsums is in pacman-contrib
          command -v updpkgsums makepkg
      - name: update PKGBUILD + checksums from release assets
        if: ${{ steps.secret.outputs.available == 'true' }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd "packaging/aur/$PKG"
          # all file mutations here happen as the builder user so ownership
          # stays consistent for the makepkg steps below
          runuser -u builder -- sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
          runuser -u builder -- sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # refresh checksums: downloads the actual release assets
          runuser -u builder -- updpkgsums
      - name: regenerate .SRCINFO
        if: ${{ steps.secret.outputs.available == 'true' }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          cd "packaging/aur/$PKG"
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
      - name: push to AUR
        if: ${{ steps.secret.outputs.available == 'true' }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          git config --global user.name "ollamux-release-bot"
          git config --global user.email "69059260+j-stechmann@users.noreply.github.com"
          cd "packaging/aur/$PKG"
          aur_repo="ssh://aur@aur.archlinux.org/$PKG.git"
          if git ls-remote "$aur_repo" HEAD >/dev/null 2>&1; then
            git clone "$aur_repo" aur
            cp PKGBUILD .SRCINFO aur/
            cd aur
            git add PKGBUILD .SRCINFO
            git diff --staged --quiet || git commit -m "upstream release ${GITHUB_REF_NAME}"
            git push origin master
          else
            # first submission: init a fresh package repo
            git init -b master aur
            cd aur
            cp ../PKGBUILD ../.SRCINFO .
            git add PKGBUILD .SRCINFO
            git commit -m "upstream release ${GITHUB_REF_NAME}"
            git remote add origin "$aur_repo"
            git push -u origin master
          fi

  # ---- 8. COPR (SRPM upload) -----------------------------------------
  # Skips cleanly when COPR_CONFIG is not configured.
  copr:
    needs: [rpm]
    runs-on: ubuntu-latest
    # least-critical channel: a COPR hiccup must not sink the release
    continue-on-error: true
    permissions:
      contents: read
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm
      - name: check for COPR config
        id: secret
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COPR_CONFIG not set — skipping COPR build (add the secret + re-run this job to publish)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: copr-cli config
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          pipx install copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: copr build
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: copr-cli build j-stechmann/ollamux *.src.rpm

  # ---- 9. crates.io --------------------------------------------------
  # Skips cleanly when CARGO_REGISTRY_TOKEN is not configured.
  cratesio:
    needs: [release]
    runs-on: ubuntu-latest
    # recoverable by hand; don't sink the release run if it flaps
    continue-on-error: true
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: check for crates.io token
        id: secret
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish (add the secret + re-run this job to publish)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: ${{ steps.secret.outputs.available == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.secret.outputs.available == 'true' }}
      - name: dry-run
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: cargo publish --locked --dry-run
      - name: publish
        if: ${{ steps.secret.outputs.available == 'true' }}
        run: cargo publish --locked