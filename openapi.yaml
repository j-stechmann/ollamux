# OpenAPI 3.0 specification for ollamux.
#
# ollamux is a key-rotating reverse proxy for the Ollama Cloud API
# (https://ollama.com). Everything under /api/* and /v1/* is relayed
# verbatim to https://ollama.com — request and response bodies are not
# rewritten — so the schemas below document the *well-known* Ollama /
# OpenAI-compatible shapes plus ollamux's own introspection endpoints
# (/_keys, /_usage, /_stats, /_health) and its proxy-generated error envelope.
openapi: 3.0.3
info:
  title: ollamux
  version: 0.9.0
  license:
    name: GPL-2.0-or-later
    url: https://github.com/j-stechmann/ollamux/blob/master/LICENSE
  description: |
    **ollamux** — an **Olla**ma **mu**ltiple**x**er: a key-rotating reverse
    proxy for the [Ollama Cloud API](https://ollama.com). It serves several
    API keys combined behind one local endpoint: requests are spread across
    keys (round-robin, least-loaded first), and when a key is rate-limited,
    rejected, or invalid, the request silently retries on the next key
    before anything reaches your client.

    ### What is proxied

    * `/api/*` — Ollama native API, relayed verbatim to `https://ollama.com`.
    * `/v1/*` — OpenAI-compatible surface, relayed verbatim.
    * Any other path answers `404` with a hint: this is **not** a local
      Ollama server; it serves no local models.

    Bodies are relayed byte-exact in both directions; query strings are
    forwarded untouched. Request bodies are buffered (needed for replay
    across failover) up to **16 MiB** — larger bodies get `413`.

    ### Failover and key rotation

    * `429` upstream: the key cools down (60 s, or the server's
      `Retry-After`, capped at 5 min) and the request retries on the next key.
    * `401`/`403 Unauthorized`: the key is marked dead until restart; the
      request retries on the next key.
    * `5xx`: retry on the next key; three consecutive `5xx` responses put a
      key in cooldown (network errors also retry on the next key, but do not
      count toward key health).
    * Any other upstream status (e.g. `400`) is relayed verbatim — it is not
      a key-health signal.
    * Failover happens *before the first response byte*, so streaming
      responses (NDJSON and SSE) are never corrupted mid-flight by a key
      switch. At most **3** upstream attempts are made per request.

    ### Authentication

    ollamux itself performs **no client authentication** — it is a
    localhost-trust tool. Your client's `Authorization` header is ignored:
    the proxy substitutes its own pool key. Requests to `/api/tags`,
    `/api/version`, and `/v1/models` are special-cased and never consume a
    pool key (they are valid upstream without credentials).

    ### Response headers on proxied traffic

    Every response carries `X-Ollamux: ollamux/<version>`. Proxied traffic
    carries `X-Ollamux-Retries` (failover attempts used); responses served
    by a pool key additionally carry `X-Ollamux-Key` (key suffix). `X-Ollamux-Affinity`
    reports prompt-cache affinity: `hit` (a usable pin existed at admission),
    `miss` (no usable pin), or `off` (disabled / no conversation identity);
    proxy-generated failures where no key was selected omit the header.

    ### Error envelope

    Proxy-generated errors use the Ollama shape (`{"error": "..."}`) under
    `/api/*` and the OpenAI shape (`{"error": {message, type, param, code}}`)
    under `/v1/*` — see `ErrorEnvelope`.
security: []
servers:
  - url: http://127.0.0.1:11435
    description: >
      Default listener (loopback only, deliberately not port 11434 so it can
      run alongside a real local Ollama). Override at startup with --addr.
tags:
  - name: proxy (Ollama native)
    description: >
      Relay of the Ollama Cloud native API. All /api/* paths are proxied
      verbatim; the ones listed here are the most-used surface.
  - name: proxy (OpenAI-compatible)
    description: >
      Relay of the OpenAI-compatible /v1/* surface (chat/completions,
      completions, models, …). All /v1/* paths are proxied verbatim.
  - name: introspection
    description: >
      ollamux-local endpoints for per-key health, usage, local statistics
      and liveness. These are answered in-memory and never touch the
      upstream (/_usage may fetch ollama.com/api/balance; /_stats and
      /_keys never do).
paths:
  /_health:
    get:
      tags: [introspection]
      summary: Liveness and pool shape
      description: >
        In-memory read. `ok` is true when at least one key is currently
        selectable (Up). Never contacts the upstream.
      operationId: getHealth
      responses:
        '200':
          description: Pool summary.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /_keys:
    get:
      tags: [introspection]
      summary: Per-key pool state
      description: >
        Pure in-memory read: never triggers an upstream fetch (incident
        readers rely on it being instant). Each row carries the key's
        `account` label and plan `tier` (inferred from per-key concurrency,
        KEY:N: free=1, pro=3, max=10). When a usage snapshot exists (from
        /_usage or --usage-aware), each row embeds the latest known usage
        under `usage`; otherwise the field is absent. Secrets are never
        exposed — only key suffixes and account labels.
      operationId: getKeys
      responses:
        '200':
          description: One row per configured key, in key-file order.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/KeyInfo'}
  /_usage:
    get:
      tags: [introspection]
      summary: Per-account and per-key Ollama Cloud usage
      description: >
        Fans out to the documented `GET https://ollama.com/api/balance`
        endpoint **once per distinct `@ACCOUNT`** (balance is
        account-scoped) and answers with an `accounts` array plus one row
        per key (suffixes and account labels only, never secrets). Legacy
        plans report used fractions of their session/weekly allowances
        (upstream's remaining_percent inverted) with reset instants;
        credit plans report USD amounts (`included_usd`, `allowance_usd`,
        `purchased_usd`) with no percent windows. The envelope also
        carries an `aggregate`: the capacity-weighted mean of the
        reporting accounts' fractions, weighted by each account's plan
        tier (inferred from concurrency, `:N`: free=1, pro=3, max=10;
        weights ×1/×50/×250) — a number in 0.0–1.0, including accounts
        currently on cooldown (usage fetching is health-blind). Keys
        sharing one account contribute once, never double-counted.
        Upstream rate-limits balance to 10 req/min per user shared across
        that user's keys: the passive 60 s poll respects that for pools
        up to ~10 accounts (larger pools burst one parallel GET per
        account and affected accounts report 429s and back off).

        With `range`, also calls the documented
        `GET https://ollama.com/api/usage?range=…&group_by=model` once per
        account and adds a `models` section with per-account totals and
        UTC buckets (request count, tokens, USD) broken down by model.
      operationId: getUsage
      parameters:
        - name: range
          in: query
          required: false
          description: >
            Enables the `models` section. `24h` uses hourly buckets,
            `7d` and `30d` daily buckets; the current bucket is marked
            `partial`.
          schema:
            type: string
            enum: [24h, 7d, 30d]
        - name: group_by
          in: query
          required: false
          description: >
            Only valid together with `range`; `model` is the only
            supported value and is the default. Anything else is a 400.
          schema:
            type: string
            enum: [model]
        - name: refresh
          in: query
          required: false
          description: >
            Any value other than `0` or `false` forces a refresh instead of
            serving the cache. Forced refreshes are rate-limited to at most
            one upstream fetch attempt per 5 s — a `refresh=1` inside that
            window serves the cached snapshot. `stale` keeps reflecting the
            60 s TTL, not this guard; the guard counts attempts, not
            successes, so failed rounds back off instead of fanning out.
            Note this guard is independent of the 60 s TTL and of the
            upstream 10 req/min per-user limit: a forced-refresh loop can
            exceed both.
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: >
            Envelope with freshness metadata, a capacity-weighted
            pool-wide `aggregate` (a 0.0–1.0 fraction like the per-key
            rows), one row per account, and one row per key (each carrying
            its inferred `tier` and `account`). Failed fetches carry
            `error` instead of numbers; upstream error bodies are never
            relayed (they could echo the key). A fetch that fails entirely
            keeps the previous good snapshot. When `range` was given,
            `models` carries the per-account model/time breakdown.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageEnvelope'}
        '400':
          description: Invalid or unsupported `range`/`group_by` (returned before any upstream call).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OllamaError'}
  /_stats:
    get:
      tags: [introspection]
      summary: Local per-request token and request statistics
      description: >
        Counters measured from traffic that passed through ollamux (not
        from ollama.com): request counts, upstream-reported input/cached/
        output tokens, wall duration, retries and final status, aggregated
        into lifetime totals, per key (account label + fingerprint), account,
        model, endpoint, HTTP status, and UTC hour/day buckets.
        Token counts come from the response body
        (`prompt_eval_count`/`prompt_eval_cached_count`/`eval_count`, or
        OpenAI-compatible `usage.*` including Responses
        `input_tokens`/`output_tokens` and cached details). Streaming
        NDJSON/SSE is sniffed incrementally without delaying forwarding.
        Successful (2xx) requests on token-bearing endpoints carrying no
        counters increment `requests_without_usage`; no input/output split
        is synthesized (total-only usage is treated as missing).
        A request the client aborts after the response has started is
        recorded as status 499 and counted under `client_aborts`, not
        `errors`; `ok + errors + client_aborts` equals `requests`.
        Purely in-memory (plus the persisted file) — never calls upstream.
        `range` selects the bucket series only: `24h` hourly (current
        partial hour + 24 previous), `7d`/`30d` daily; the current bucket is `partial`. Counters persist by
        default under `$OLLAMUX_STATS_FILE` / `$XDG_STATE_HOME/ollamux/stats.json`
        (override with `--stats-file`, disable entirely with `--no-stats`,
        which returns `enabled: false`). `range` scopes only `buckets` and
        `window_totals`; `totals` and all dimension rows are lifetime
        (`totals_scope: lifetime`). Rows are capped at 512 historical keys,
        256 accounts, 256 models and 128 endpoints; stats files over
        16 MiB are left untouched.
      operationId: getStats
      parameters:
        - name: range
          in: query
          required: false
          description: Bucket granularity and window. Default `24h`; 24h is the current partial hour plus 24 previous, 7d/30d are daily buckets.
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
      responses:
        '200':
          description: >
            Local aggregates. `since` is the first observation ever
            (persisted); `started_at`/`uptime_s` describe this process.
            `keys` carries configured keys even before traffic and marks
            historical rows `present: false`.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalStatsEnvelope'}
        '400':
          description: Invalid `range` (returned before any work).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OllamaError'}
  /:
    get:
      tags: [introspection]
      summary: Unknown-path hint (404)
      description: >
        Everything outside `/api/*`, `/v1/*`, `/_keys`, `/_usage`,
        `/_stats` and `/_health` answers 404 with a hintful JSON body — the
        top confusion is expecting a local Ollama server. Shown here for
        `/`; any unknown path behaves identically.
      operationId: getRoot
      responses:
        '404':
          description: Hintful not-found (see UnknownPathHint).
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnknownPathHint'}

  /api/tags:
    get:
      tags: [proxy (Ollama native)]
      summary: List available models
      description: >
        Relayed to `https://ollama.com/api/tags`. Never consumes a pool key,
        never rotates, never marks key health. `ollama list` against the
        proxy shows the cloud model list, not local models.
      operationId: listOllamaModels
      responses:
        '200':
          description: Upstream model list, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OllamaModelList'}
        '502':
          description: >
            ollamux could not reach the upstream. No automatic retry applies
            to this endpoint — repeat the request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/version:
    get:
      tags: [proxy (Ollama native)]
      summary: Upstream version
      description: >
        Relayed to `https://ollama.com/api/version`. Never consumes a pool
        key, never rotates, never marks key health. (This reports the
        upstream version, not ollamux's — ollamux identifies itself via
        `X-Ollamux`.)
      operationId: getOllamaVersion
      responses:
        '200':
          description: Upstream version, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OllamaVersion'}
        '502':
          description: Upstream unreachable (no automatic retry).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/chat:
    post:
      tags: [proxy (Ollama native)]
      summary: Chat completion (Ollama native)
      description: >
        Relayed to `https://ollama.com/api/chat` with key rotation,
        per-key concurrency slots, and failover. Streams NDJSON by default
        (`"stream": false` for a single JSON object). Conversation identity
        is derived from `model` + leading system messages + first user
        message for prompt-cache affinity; responses carry
        `X-Ollamux-Affinity: hit|miss|off`.
      operationId: ollamaChat
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OllamaChatRequest'}
      responses:
        '200':
          description: >
            Upstream response, relayed verbatim. NDJSON chunks when
            streaming, a single JSON object otherwise.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
            X-Ollamux-Key: {$ref: '#/components/headers/X-Ollamux-Key'}
            X-Ollamux-Retries: {$ref: '#/components/headers/X-Ollamux-Retries'}
            X-Ollamux-Affinity: {$ref: '#/components/headers/X-Ollamux-Affinity'}
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/OllamaChatChunk'}
            application/json:
              schema: {$ref: '#/components/schemas/OllamaChatFinal'}
        '413':
          description: Request body exceeds the 16 MiB buffering cap.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: >
            Overloaded locally (all keys at their concurrency limit / all
            cooling down). Honors `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: >
            All pool keys have been marked dead by the upstream (401/403 on
            prior attempts). Dead keys stay dead until restart; per-key
            state: GET /_keys. Proxy-generated response, so it carries
            neither X-Ollamux-Retries nor X-Ollamux-Key. Note: an upstream
            403 *without* the Ollama `Unauthorized` body (e.g. a CDN/WAF
            block page) is relayed verbatim instead and *does* carry both
            headers — distinguish by header presence, not status alone.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '502':
          description: >
            All failover attempts exhausted. Proxy-generated response, so it
            carries neither X-Ollamux-Retries nor X-Ollamux-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/generate:
    post:
      tags: [proxy (Ollama native)]
      summary: Text generation (Ollama native)
      description: >
        Relayed to `https://ollama.com/api/generate` with key rotation and
        failover. Streams NDJSON by default. Affinity identity is `model` +
        first 8 KiB of `prompt`.
      operationId: ollamaGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OllamaGenerateRequest'}
      responses:
        '200':
          description: Upstream response, relayed verbatim (NDJSON or single JSON).
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
            X-Ollamux-Key: {$ref: '#/components/headers/X-Ollamux-Key'}
            X-Ollamux-Retries: {$ref: '#/components/headers/X-Ollamux-Retries'}
            X-Ollamux-Affinity: {$ref: '#/components/headers/X-Ollamux-Affinity'}
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/OllamaGenerateChunk'}
            application/json:
              schema: {$ref: '#/components/schemas/OllamaGenerateFinal'}
        '413':
          description: Request body exceeds the 16 MiB buffering cap.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: Overloaded locally. Honors `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: >
            All pool keys have been marked dead by the upstream (401/403 on
            prior attempts). Dead keys stay dead until restart; per-key
            state: GET /_keys. Proxy-generated response, so it carries
            neither X-Ollamux-Retries nor X-Ollamux-Key. Note: an upstream
            403 *without* the Ollama `Unauthorized` body (e.g. a CDN/WAF
            block page) is relayed verbatim instead and *does* carry both
            headers — distinguish by header presence, not status alone.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '502':
          description: >
            All failover attempts exhausted. Proxy-generated response, so it
            carries neither X-Ollamux-Retries nor X-Ollamux-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /api/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string, minLength: 1}
        description: >
          Any remaining Ollama API sub-path (e.g. `show`, `ps`, `embeddings`),
          including nested paths (`blobs/<digest>`). Note the `{path}`
          template matches a single path segment under OpenAPI rules, but
          ollamux relays any depth verbatim to
          `https://ollama.com/api/<path>` — no request rewriting, models
          must exist on ollama.com.
    get:
      tags: [proxy (Ollama native)]
      summary: Relay any GET under /api/
      operationId: proxyOllamaGet
      responses:
        '2XX':
          description: Upstream response, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
        default:
          description: >
            Upstream status relayed verbatim (4xx other than
            401/403-Unauthorized is the client's fault and passes through
            untouched), or a proxy-generated 413/429/403/502 — see
            `ErrorEnvelope`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      tags: [proxy (Ollama native)]
      summary: Relay any POST under /api/
      operationId: proxyOllamaPost
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '2XX':
          description: Upstream response, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
        default:
          description: Upstream status or proxy-generated error (see above).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/models:
    get:
      tags: [proxy (OpenAI-compatible)]
      summary: List models (OpenAI-compatible)
      description: >
        Relayed to `https://ollama.com/v1/models`. Never consumes a pool
        key, never rotates, never marks key health.
      operationId: listOpenAIModels
      responses:
        '200':
          description: Upstream model list, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIModelList'}
        '502':
          description: Upstream unreachable (no automatic retry).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /v1/chat/completions:
    post:
      tags: [proxy (OpenAI-compatible)]
      summary: Chat completion (OpenAI-compatible)
      description: >
        Relayed to `https://ollama.com/v1/chat/completions` with key
        rotation and failover. Unlike the Ollama native API, the OpenAI
        surface defaults to **non-streaming**; SSE only when
        `"stream": true`. Affinity identity: `model` + leading system
        messages + first user message.
      operationId: openaiChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenAIChatRequest'}
      responses:
        '200':
          description: >
            Upstream response, relayed verbatim: a single JSON object, or an
            SSE stream of `data:` chunks when `"stream": true`.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
            X-Ollamux-Key: {$ref: '#/components/headers/X-Ollamux-Key'}
            X-Ollamux-Retries: {$ref: '#/components/headers/X-Ollamux-Retries'}
            X-Ollamux-Affinity: {$ref: '#/components/headers/X-Ollamux-Affinity'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIChatCompletion'}
            text/event-stream:
              schema: {type: string}
        '413':
          description: Request body exceeds the 16 MiB buffering cap.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: Overloaded locally. Honors `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: >
            All pool keys have been marked dead by the upstream (401/403 on
            prior attempts). Dead keys stay dead until restart; per-key
            state: GET /_keys. Proxy-generated response, so it carries
            neither X-Ollamux-Retries nor X-Ollamux-Key. Note: an upstream
            403 *without* the Ollama `Unauthorized` body (e.g. a CDN/WAF
            block page) is relayed verbatim instead and *does* carry both
            headers — distinguish by header presence, not status alone.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '502':
          description: >
            All failover attempts exhausted. Proxy-generated response, so it
            carries neither X-Ollamux-Retries nor X-Ollamux-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /v1/completions:
    post:
      tags: [proxy (OpenAI-compatible)]
      summary: Text completion (OpenAI-compatible)
      description: >
        Relayed to `https://ollama.com/v1/completions` with key rotation and
        failover. Non-streaming by default; SSE when `"stream": true`.
        Affinity identity: `model` + first 8 KiB of `prompt`.
      operationId: openaiCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              additionalProperties: true
              properties:
                model: {type: string}
                prompt: {type: string}
                stream: {type: boolean, default: false}
      responses:
        '200':
          description: Upstream response, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
            X-Ollamux-Key: {$ref: '#/components/headers/X-Ollamux-Key'}
            X-Ollamux-Retries: {$ref: '#/components/headers/X-Ollamux-Retries'}
            X-Ollamux-Affinity: {$ref: '#/components/headers/X-Ollamux-Affinity'}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/event-stream:
              schema: {type: string}
        '413':
          description: Request body exceeds the 16 MiB buffering cap.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: Overloaded locally. Honors `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403':
          description: >
            All pool keys have been marked dead by the upstream (401/403 on
            prior attempts). Dead keys stay dead until restart; per-key
            state: GET /_keys. Proxy-generated response, so it carries
            neither X-Ollamux-Retries nor X-Ollamux-Key. Note: an upstream
            403 *without* the Ollama `Unauthorized` body (e.g. a CDN/WAF
            block page) is relayed verbatim instead and *does* carry both
            headers — distinguish by header presence, not status alone.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '502':
          description: >
            All failover attempts exhausted. Proxy-generated response, so it
            carries neither X-Ollamux-Retries nor X-Ollamux-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /v1/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string, minLength: 1}
        description: >
          Any remaining OpenAI-compatible sub-path (e.g. `embeddings`),
          including nested paths (`models/<id>`). Note the `{path}`
          template matches a single path segment under OpenAPI rules, but
          ollamux relays any depth verbatim to `https://ollama.com/v1/<path>`.
    get:
      tags: [proxy (OpenAI-compatible)]
      summary: Relay any GET under /v1/
      operationId: proxyOpenAIGet
      responses:
        '2XX':
          description: Upstream response, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
        default:
          description: Upstream status or proxy-generated error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      tags: [proxy (OpenAI-compatible)]
      summary: Relay any POST under /v1/
      operationId: proxyOpenAIPost
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '2XX':
          description: Upstream response, relayed verbatim.
          headers:
            X-Ollamux: {$ref: '#/components/headers/X-Ollamux'}
        default:
          description: Upstream status or proxy-generated error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

components:
  headers:
    X-Ollamux:
      description: >
        Present on every response, including relayed upstream errors:
        `ollamux/<version>` — lets a client tell ollamux apart from a real
        Ollama server or a CDN error page.
      schema: {type: string, example: 'ollamux/0.9.0'}
    X-Ollamux-Key:
      description: >
        Suffix of the pool key that served the request. Present only when a
        pool key served it (never on /_keys, /_usage, /_stats, /_health, 404 hints,
        or no-auth paths such as /api/tags).
      schema: {type: string, example: '1234'}
    X-Ollamux-Retries:
      description: >
        Number of failover attempts used before this response (0 = first
        key succeeded). Present on proxied traffic only.
      schema: {type: integer, minimum: 0}
    X-Ollamux-Affinity:
      description: >
        Prompt-cache affinity verdict: `hit` (a pin existed and was usable —
        healthy, under quota, free slot — at admission), `miss` (first
        request of a conversation, evicted, or the pinned key fell through),
        or `off` (affinity disabled or the body gave no identity). Present
        only when a pool key served the request. Advisory: `hit` refers to
        admission only — after a failover the request may be served by a
        different key than the pin.
      schema: {type: string, enum: [hit, miss, off]}
  schemas:
    # ----- introspection -----
    Health:
      type: object
      required: [service, version, ok, keys, total_slots]
      properties:
        service: {type: string, enum: [ollamux]}
        version: {type: string, example: '0.8.0'}
        ok:
          type: boolean
          description: True when at least one key is selectable right now.
        keys:
          type: integer
          description: Number of configured keys.
        total_slots:
          type: integer
          description: Sum of per-key concurrency limits.
    KeyState:
      type: string
      enum: [up, cooldown, dead]
      description: >
        `up` = selectable. `cooldown` = temporarily backed off (429 or
        repeated failures); expires lazily. `dead` = upstream rejected the
        key as invalid (401/403); stays dead until restart.
    UsageBrief:
      type: object
      description: >
        Latest known usage embedded in a /_keys row (absent when no usage
        snapshot exists, or when the key row carried no numbers). Windows
        absent from the snapshot stay absent — never fabricated from the
        other window.
      required: [over_quota]
      properties:
        session:
          type: number
          description: Used fraction of the session window's allowance (0.0–1.0); omitted when unknown.
        weekly:
          type: number
          description: Used fraction of the weekly window's allowance (0.0–1.0); omitted when unknown.
        session_pct: {type: number, description: One-decimal percent mirror of `session`.}
        weekly_pct: {type: number, description: One-decimal percent mirror of `weekly`.}
        over_quota:
          type: boolean
          description: >
            True when session usage is at/over the --usage-aware threshold
            (always false when quota-aware routing is disabled).
    KeyInfo:
      type: object
      required:
        - index
        - suffix
        - account
        - state
        - concurrency
        - tier
        - in_use
        - waiters
        - strikes
        - fails
        - successes
      properties:
        index: {type: integer, description: Zero-based position in the keys file.}
        suffix: {type: string, description: Last characters of the key — never the secret.}
        account:
          type: string
          description: >
            Account label from the key's `@ACCOUNT` suffix (never a
            secret). Keys sharing a label belong to one ollama.com
            account, and usage/balance are fetched once per account.
        state: {$ref: '#/components/schemas/KeyState'}
        concurrency: {type: integer, description: 'Max in-flight requests for this key (KEY:N, default 3).'}
        tier:
          type: string
          description: >
            Plan tier inferred from `concurrency`: exactly 1 → `free`,
            2–3 → `pro`, 4 and beyond → `max` (more concurrency than a
            tier's normal limit is the next tier up). Derived from the
            key's own configuration, independent of any usage snapshot.
        in_use: {type: integer, description: Slots currently held.}
        waiters: {type: integer, description: Requests currently blocked waiting for a slot on this key.}
        cooldown_left_s:
          type: integer
          description: Seconds until the cooldown expires (cooldown state only).
        strikes:
          type: integer
          description: Consecutive failures; reset by any confirmed upstream success.
        fails: {type: integer, description: Lifetime failed upstream attempts.}
        successes: {type: integer, description: Lifetime confirmed upstream successes.}
        last_error:
          type: string
          description: Most recent failure reason (absent before the first failure).
        usage:
          $ref: '#/components/schemas/UsageBrief'
    UsageMetrics:
      type: object
      required: [request_count]
      properties:
        request_count: {type: integer}
        usage_usd:
          type: number
          description: Total value of the requests in USD, including plan-covered usage.
        input_tokens: {type: integer, description: Input tokens, including cached input.}
        cached_input_tokens: {type: integer, description: Input tokens read from cache (included in input_tokens).}
        output_tokens: {type: integer}
    LocalMetrics:
      type: object
      required:
        - requests
        - ok
        - errors
        - client_aborts
        - requests_without_usage
        - input_tokens
        - cached_input_tokens
        - output_tokens
        - total_tokens
        - duration_ms
        - retries
      properties:
        requests: {type: integer, description: Client-visible requests counted.}
        ok: {type: integer, description: Requests whose final status was below 400 (excluding client aborts).}
        errors:
          type: integer
          description: >
            Requests whose final status was 400 or above, excluding client
            aborts (499). `ok + errors + client_aborts` equals `requests`.
        client_aborts:
          type: integer
          description: >
            Requests the client aborted after the response had started (mid-stream
            disconnect, recorded as status 499). The upstream key served the
            request, so these are tracked separately from `errors`.
        requests_without_usage:
          type: integer
          description: >
            Successful (2xx) requests to token-bearing endpoints (chat,
            generate, embed; native and OpenAI-compatible, including
            Responses) whose response carried no token counters. They
            contribute zero tokens; no input/output split is synthesized.
            Metadata/management endpoints such as `/api/show`,
            `/api/ps`, `/api/embeddings` and 3xx responses are not counted
            here.
        input_tokens: {type: integer, description: Upstream-reported input tokens, including cached input.}
        cached_input_tokens:
          type: integer
          description: >
            Upstream-reported cached input tokens, from
            `prompt_tokens_details.cached_tokens` /
            `input_tokens_details.cached_tokens` (OpenAI-compatible) or
            `prompt_eval_cached_count` (native).
        output_tokens: {type: integer}
        total_tokens: {type: integer, description: input_tokens + output_tokens.}
        duration_ms: {type: integer, description: Summed wall time of the included requests.}
        avg_ms: {type: number, nullable: true, description: duration_ms / requests (null when no requests).}
        retries: {type: integer, description: Failover attempts made by the included requests.}
    LocalKeyRow:
      allOf:
        - $ref: '#/components/schemas/LocalMetrics'
        - type: object
          required: [account, id, suffix, present]
          properties:
            account:
              type: string
              description: 'Account label from the keys file (`(unattributed)` for requests with no key, `<other>` for overflow history).'
            id:
              type: string
              description: 'Stable non-secret key fingerprint used for identity across restarts (`(unattributed)` for no-key traffic, `<other>` for overflow history).'
            suffix: {type: string, description: 'Last characters of the key — never the secret (`(unattributed)` for no-key traffic, `<other>` for overflow history).'}
            present:
              type: boolean
              description: True when the key is in the current pool; false for historical rows retained after a keys-file change.
    LocalAccountRow:
      allOf:
        - $ref: '#/components/schemas/LocalMetrics'
        - type: object
          required: [account]
          properties:
            account:
              type: string
              description: 'Account label (`(unattributed)` for requests with no key, `<other>` for overflow history).'
    LocalModelRow:
      allOf:
        - $ref: '#/components/schemas/LocalMetrics'
        - type: object
          required: [model]
          properties:
            model:
              type: string
              description: >
                Model from the request body (`(none)` when absent or
                unparseable), or `<other>` when the 256-name cap is
                exceeded.
    LocalEndpointRow:
      allOf:
        - $ref: '#/components/schemas/LocalMetrics'
        - type: object
          required: [endpoint]
          properties:
            endpoint: {type: string, description: 'Proxied path group, e.g. `api/chat` or `v1/chat/completions`; `<other>` once the 128-endpoint cap is exceeded.'}
    LocalBucket:
      allOf:
        - $ref: '#/components/schemas/LocalMetrics'
        - type: object
          required: [from, until, partial]
          properties:
            from: {type: string, format: date-time, description: Inclusive UTC start.}
            until: {type: string, format: date-time, description: Exclusive UTC end.}
            partial: {type: boolean, description: True for the current, still-in-progress bucket.}
    LocalStatsEnvelope:
      type: object
      required:
        - source
        - enabled
        - version
        - since
        - since_iso
        - started_at
        - uptime_s
        - range
        - granularity
        - totals
        - keys
        - accounts
        - models
        - endpoints
        - by_status
        - buckets
        - persistence
        - totals_scope
        - window_totals
      properties:
        source: {type: string, enum: [local]}
        enabled:
          type: boolean
          description: False when `--no-stats` / `OLLAMUX_NO_STATS` disables counting; counters/rows are empty, while envelope metadata (since, uptime, range, persistence) is still present.
        version: {type: integer, description: Persisted schema version.}
        since: {type: integer, description: Unix seconds of the first-ever observation (persisted).}
        since_iso: {type: string, format: date-time}
        started_at: {type: integer, description: Unix seconds when this process started.}
        uptime_s: {type: integer}
        saved_at:
          type: integer
          nullable: true
          description: Unix seconds of the last successful persistence flush (null before the first flush or with --no-stats).
        pending_flush: {type: boolean}
        persistence:
          type: string
          enum: [file, memory, blocked, disabled, error]
          description: >
            `file` = persisted; `memory` = an in-memory meter;
            `blocked` = persistence disabled because the target is
            foreign, corrupt, newer-versioned, oversized, non-regular,
            unwritable, or owned by another live instance (the process
            runs in memory); `disabled` = --no-stats /
            OLLAMUX_NO_STATS (nothing is counted); `error` = the most
            recent flush failed (`last_flush_error` has details).
        persistence_note:
          type: string
          nullable: true
          description: Explanation for a blocked stats file (or a preserved/unreadable one).
        last_flush_error:
          type: string
          nullable: true
          description: Most recent persistence write failure, cleared by a successful flush.
        range:
          type: string
          enum: [24h, 7d, 30d]
          description: Bucket/window range; does not scope totals or dimensions.
        granularity: {type: string, enum: [hour, day]}
        totals_scope:
          type: string
          enum: [lifetime]
          description: Totals and dimension rows are lifetime, not range-scoped.
        totals: {$ref: '#/components/schemas/LocalMetrics'}
        window:
          type: object
          nullable: true
          description: The bucket window covered by `window_totals`.
          properties:
            from: {type: string, format: date-time}
            until: {type: string, format: date-time}
        window_totals:
          allOf:
            - $ref: '#/components/schemas/LocalMetrics'
          description: Sum of the selected buckets (`range` window), not lifetime.
        keys:
          type: array
          items: {$ref: '#/components/schemas/LocalKeyRow'}
        accounts:
          type: array
          items: {$ref: '#/components/schemas/LocalAccountRow'}
        models:
          type: array
          items: {$ref: '#/components/schemas/LocalModelRow'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/LocalEndpointRow'}
        by_status:
          type: object
          additionalProperties: {type: integer}
          description: Final recorded status code → request count (499 denotes a mid-stream client abort, 502 an upstream failure after headers).
        buckets:
          type: array
          items: {$ref: '#/components/schemas/LocalBucket'}
    UsageGroup:
      allOf:
        - $ref: '#/components/schemas/UsageMetrics'
        - type: object
          required: [model]
          properties:
            model: {type: string}
    UsageSummary:
      allOf:
        - $ref: '#/components/schemas/UsageMetrics'
        - type: object
          properties:
            groups:
              type: array
              description: >
                Present with `group_by=model`: up to 10 models, ranked by
                cost (or request count on legacy plans), same order in
                every bucket. Models without requests in a bucket are
                omitted.
              items: {$ref: '#/components/schemas/UsageGroup'}
            remainder:
              $ref: '#/components/schemas/UsageMetrics'
    UsageBucket:
      allOf:
        - $ref: '#/components/schemas/UsageSummary'
        - type: object
          required: [from, until]
          properties:
            from: {type: string, format: date-time, description: Inclusive UTC start.}
            until: {type: string, format: date-time, description: Exclusive UTC end.}
            partial:
              type: boolean
              description: True for the current, still-in-progress hour or day.
    AccountStats:
      type: object
      required: [account, keys, ok]
      properties:
        account: {type: string}
        keys: {type: integer, description: Member keys in the pool.}
        ok: {type: boolean}
        as_of:
          type: integer
          format: int64
          description: >
            Unix seconds of the original fetch when this row was carried
            through a transient failure or 429 backoff; absent when fresh.
        error: {type: string}
        totals: {$ref: '#/components/schemas/UsageSummary'}
        buckets:
          type: array
          items: {$ref: '#/components/schemas/UsageBucket'}
    ModelsSection:
      type: object
      required: [range, group_by, updated, age_s, stale, accounts, pool]
      properties:
        range: {type: string, enum: [24h, 7d, 30d]}
        granularity:
          type: string
          enum: [hour, day]
          nullable: true
          description: Hourly for 24h, daily for 7d/30d. Null when every account failed.
        group_by: {type: string, enum: [model]}
        from: {type: string, format: date-time, nullable: true}
        until: {type: string, format: date-time, nullable: true}
        updated: {type: integer, format: int64}
        age_s: {type: integer}
        stale: {type: boolean}
        accounts:
          type: array
          items: {$ref: '#/components/schemas/AccountStats'}
        pool:
          type: object
          required: [totals]
          description: Summed per account (never per key), model groups merged by name.
          properties:
            totals: {$ref: '#/components/schemas/UsageSummary'}
    UsageEnvelope:
      type: object
      required: [updated, age_s, stale, session_window, aggregate, accounts, keys]
      properties:
        updated:
          type: integer
          format: int64
          description: Unix seconds when the snapshot was fetched.
        age_s:
          type: integer
          description: Age of the snapshot in seconds.
        stale:
          type: boolean
          description: >
            True when age_s >= 60 (the serve TTL): the snapshot is still
            served, but a newer one exists or will be fetched on demand.
        session_window:
          type: string
          description: Human hint; per-window reset timestamps are in the aggregate/rows.
        aggregate: {$ref: '#/components/schemas/UsageAggregate'}
        accounts:
          type: array
          description: >
            One row per distinct `@ACCOUNT`, in keys-file order. Balance
            is account-scoped: keys sharing a label fan out to the same
            numbers, and the aggregate weights the account once.
          items: {$ref: '#/components/schemas/AccountUsageInfo'}
        keys:
          type: array
          items: {$ref: '#/components/schemas/KeyUsage'}
        models:
          $ref: '#/components/schemas/ModelsSection'
    AccountUsageInfo:
      type: object
      required: [account, keys, ok, tier]
      description: Account-level mirror of a balance row (no key-specific fields).
      properties:
        account: {type: string}
        keys:
          type: integer
          description: Number of pool keys labelled with this account.
        ok: {type: boolean}
        tier: {type: string}
        session: {type: number, nullable: true}
        weekly: {type: number, nullable: true}
        session_pct: {type: number, nullable: true}
        weekly_pct: {type: number, nullable: true}
        session_resets_at: {type: string, nullable: true}
        weekly_resets_at: {type: string, nullable: true}
        included_usd: {type: number, nullable: true}
        allowance_usd: {type: number, nullable: true}
        purchased_usd: {type: number, nullable: true}
        as_of: {type: integer, format: int64, nullable: true}
        error: {type: string, nullable: true}
    KeyUsage:
      type: object
      required: [index, suffix, account, ok, tier]
      description: >
        One per-key usage row. `ok:false` rows carry `error` only.
        Transient failures (429, 5xx, network blips) and 429-backoff
        skips do not produce error rows when the key has prior good
        data: the last good row is carried forward and marked `as_of`.
      properties:
        index: {type: integer}
        suffix: {type: string}
        account: {type: string, description: Account label this key belongs to.}
        ok: {type: boolean}
        tier:
          type: string
          description: >
            Plan tier inferred from the key's concurrency (KEY:N): exactly
            1 → `free`, 2–3 → `pro`, 4 and beyond → `max`. Injected by
            ollamux at render time (not part of the upstream payload); it
            is also the tier whose weight the aggregate applies.
        status:
          type: integer
          description: >
            Upstream HTTP status for this key's fetch; present only on
            `ok:true` rows, where it is always 200. Failure rows (`ok:false`)
            omit it regardless of whether a response arrived — the reason is
            in `error`.
        session:
          type: number
          description: >
            Used fraction of the session window's allowance (0.0–1.0 =
            1 − upstream remaining_percent/100, a legacy plan's real limit).
            Omitted when unknown or on credit-plan rows — absent means
            unknown, never 0.
        weekly:
          type: number
          description: >
            Used fraction of the weekly window's allowance (0.0–1.0).
            Omitted when unknown or on credit-plan rows.
        session_pct: {type: number, description: One-decimal percent mirror of `session`.}
        weekly_pct: {type: number, description: One-decimal percent mirror of `weekly`.}
        session_resets_at:
          type: string
          description: Next session-window reset in UTC, when upstream publishes one.
        weekly_resets_at:
          type: string
          description: Next weekly-window reset in UTC, when upstream publishes one.
        included_usd:
          type: number
          description: >
            Credit plans only: remaining included credits in USD for the
            current period (absent on legacy plans).
        allowance_usd:
          type: number
          description: >-
            Credit plans only: included credits available for the full
            period in USD.
        purchased_usd:
          type: number
          description: >-
            Remaining unexpired purchased credits in USD; mirrors the
            upstream balance (legacy bodies commonly report 0 when no
            purchase exists).
        as_of:
          type: integer
          format: int64
          description: >
            Unix seconds when this row's data was fetched; present only
            on rows carried forward from a previous round — the key's
            latest fetch failed transiently (429/5xx/network) or was
            skipped in 429 backoff — and then it is the original fetch
            time, however many rounds carried it. Absent means the row
            is fresh this round (the envelope's `age_s` then covers it).
        error:
          type: string
          description: >
            Per-key failure reason (e.g. `unauthorized`, `rate limited
            (upstream 429)`, `endpoint changed (unexpected payload)`) —
            generated by ollamux; upstream bodies are never relayed here.
            A transiently failing key with prior good data carries that
            row instead (see `as_of`), so `error` means the failure is
            persistent or there was nothing good to carry.
    UsageAggregate:
      type: object
      description: >
        Pool-wide usage as a capacity-weighted mean: every ok account's
        usage fraction (a fraction of *its own plan's allowance* —
        upstream's remaining_percent inverted) times its tier's cap weight
        (free ×1, pro ×50, max ×250), summed and divided by the summed
        weights of exactly the accounts that reported the window — so the
        result is a fraction in 0.0–1.0 like the per-key rows (a
        single-account pool reproduces that account's own fraction, and
        dead accounts never dilute the number). Keys sharing one account
        are grouped and contribute once, never double-counted. Credit-plan
        rows have no window fractions and sit out. Accounts on cooldown
        contribute too — usage fetching never consults pool health — and so
        do rows carried from a previous round (their last known good
        fraction). An account marked dead (401/403) is expected to fail its
        own usage fetch the same way and therefore contributes nothing.
        Rounded to 3 decimals; a window no ok row reports is `null`, never
        0 (`resets_at` fields publish the window's reset instant only when
        every reporting account agrees on one).
      required: [session, weekly, unit, session_resets_at, weekly_resets_at]
      properties:
        session:
          type: number
          nullable: true
          description: >
            Session-window fraction of the reporting keys' combined
            capacity (0.0–1.0).
        weekly:
          type: number
          nullable: true
          description: >
            Weekly-window fraction of the reporting keys' combined
            capacity (0.0–1.0).
        session_resets_at:
          type: string
          nullable: true
          description: The window's reset instant in UTC, when all reporting keys agree.
        weekly_resets_at:
          type: string
          nullable: true
          description: The window's reset instant in UTC, when all reporting keys agree.
        unit:
          type: string
          description: >
            Always `pool capacity fraction`: the aggregate is a
            capacity-weighted mean of the per-account fractions, weighted
            by the free plan's cap multiples (pro = 50× free, max = 5×
            pro). Keys sharing one account contribute once.
    UnknownPathHint:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >
            Explanation that ollamux serves only /api/*, /v1/*, /_keys,
            /_usage, /_stats, /_health and is not a local Ollama server.

    # ----- error envelope -----
    ErrorEnvelope:
      description: >
        Proxy-generated errors use the Ollama shape under /api/* and the
        OpenAI shape under /v1/*. Upstream 4xx errors (other than the
        failover-triggering 401/403) are relayed byte-exact and may have
        any shape.
      oneOf:
        - $ref: '#/components/schemas/OllamaError'
        - $ref: '#/components/schemas/OpenAIError'
    OllamaError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error; ollamux-generated messages mention ollamux explicitly.
      example: {error: 'ollamux is overloaded: … Per-key state: GET /_keys'}
    OpenAIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: {type: string}
            type: {type: string, enum: [ollamux_error]}
            param:
              type: string
              nullable: true
            code: {type: string, example: 'ollamux_429'}

    # ----- Ollama native (loose schemas; bodies are relayed verbatim) -----
    OllamaMessage:
      type: object
      required: [role, content]
      additionalProperties: true
      properties:
        role: {type: string, enum: [system, user, assistant, tool]}
        content: {type: string}
        images:
          type: array
          items: {type: string}
          description: Base64-encoded images.
    OllamaChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: >
        Ollama /api/chat request. All Ollama fields (options, tools,
        format, keep_alive, think, …) pass through verbatim.
      properties:
        model: {type: string}
        messages:
          type: array
          items: {$ref: '#/components/schemas/OllamaMessage'}
        stream:
          type: boolean
          default: true
          description: Ollama streams by default; false returns one JSON object.
    OllamaChatChunk:
      type: object
      additionalProperties: true
      description: One NDJSON streaming chunk (message delta + done:false).
      properties:
        model: {type: string}
        created_at: {type: string}
        message:
          type: object
          additionalProperties: true
          properties:
            role: {type: string}
            content: {type: string}
        done: {type: boolean, enum: [false]}
    OllamaChatFinal:
      type: object
      additionalProperties: true
      description: Final non-streamed object or last NDJSON chunk (done:true).
      properties:
        model: {type: string}
        created_at: {type: string}
        message:
          type: object
          additionalProperties: true
        done: {type: boolean, enum: [true]}
        done_reason: {type: string}
        total_duration: {type: integer, format: int64}
    OllamaGenerateRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model: {type: string}
        prompt: {type: string}
        stream: {type: boolean, default: true}
    OllamaGenerateChunk:
      type: object
      additionalProperties: true
      description: One NDJSON streaming chunk.
      properties:
        model: {type: string}
        created_at: {type: string}
        response: {type: string}
        done: {type: boolean, enum: [false]}
    OllamaGenerateFinal:
      type: object
      additionalProperties: true
      description: Final generation object (done:true).
      properties:
        model: {type: string}
        created_at: {type: string}
        response: {type: string}
        done: {type: boolean, enum: [true]}
        total_duration: {type: integer, format: int64}
    OllamaModelList:
      type: object
      additionalProperties: true
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name: {type: string}
              model: {type: string}
              size: {type: integer, format: int64}
              digest: {type: string}
    OllamaVersion:
      type: object
      required: [version]
      additionalProperties: true
      properties:
        version: {type: string}

    # ----- OpenAI-compatible (loose schemas; bodies are relayed verbatim) -----
    OpenAIChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: >
        Standard OpenAI chat-completions request; all fields pass through
        verbatim.
      properties:
        model: {type: string}
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            additionalProperties: true
            properties:
              role: {type: string}
              content: {}
        stream: {type: boolean, default: false}
    OpenAIChatCompletion:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        object: {type: string, enum: [chat.completion]}
        choices:
          type: array
          items: {type: object, additionalProperties: true}
        usage: {type: object, additionalProperties: true}
    OpenAIModelList:
      type: object
      additionalProperties: true
      required: [object, data]
      properties:
        object: {type: string, enum: [list]}
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: {type: string}
              object: {type: string, enum: [model]}
