[package]
name = "ollamux"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Key-rotating reverse proxy for the Ollama Cloud API"
license = "GPL-2.0-or-later"
authors = ["Jonathan Stechmann <69059260+j-stechmann@users.noreply.github.com>"]
repository = "https://github.com/j-stechmann/ollamux"
homepage = "https://github.com/j-stechmann/ollamux"
readme = "README.md"
keywords = ["ollama", "proxy", "reverse-proxy", "llm", "api"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/target", "/packaging", "/debian", "/.github", "/scripts", "Ideas.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
serde_json = "1"

[features]
default = []
net = []

[profile.release]
lto = true
codegen-units = 1
strip = true
